<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shift, Leave & Schedule Dashboard</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#182230}button{font:inherit;cursor:pointer}.app{max-width:1280px;margin:auto;padding:28px}.topbar{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.title{font-size:28px;font-weight:750}.sub{color:#667085;margin-top:5px}.mode{padding:8px 12px;border-radius:999px;background:#e8f7ee;color:#176b3a;font-size:13px;font-weight:650}.grid-top{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.panel{background:white;border:1px solid #e6eaf0;border-radius:16px;padding:20px;box-shadow:0 3px 15px rgba(16,24,40,.04)}.panel h2{font-size:17px;margin:0 0 15px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{border:1px solid #edf0f4;border-radius:12px;padding:16px;background:#fafbfc}.metric .label{font-size:12px;color:#667085}.metric .value{font-size:20px;font-weight:720;margin-top:7px}.calendar-btn{width:100%;padding:13px 16px;border:0;border-radius:10px;background:#1f5eff;color:#fff;font-weight:650}.horizon{margin-top:18px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:13px 12px;text-align:left;border-bottom:1px solid #edf0f4}.table th{font-size:12px;color:#667085;background:#fafbfc}.table td{font-size:14px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef3ff}.overlay{position:fixed;inset:0;background:rgba(15,23,42,.48);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modal{background:white;width:min(1080px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:20px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.modal.small{width:min(650px,100%)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.close{border:0;background:#f1f3f6;border-radius:9px;width:36px;height:36px}.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.navbtn{border:1px solid #dce1e8;background:white;border-radius:9px;padding:8px 12px}.month-title{font-weight:700}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.dow{text-align:center;font-size:11px;color:#667085;padding:5px}.day{position:relative;min-height:92px;border:1px solid #e5e9ef;border-radius:10px;background:#fff;padding:8px;text-align:left}.day.muted{background:#fafbfc;color:#a1a9b4}.day:hover{border-color:#9db7ff}.day-num{font-weight:700;font-size:13px}.shift-mini{font-size:10px;margin-top:6px;line-height:1.35}.tooltip{position:fixed;z-index:30;background:#111827;color:white;padding:10px 12px;border-radius:9px;font-size:12px;pointer-events:none;max-width:260px;box-shadow:0 8px 25px rgba(0,0,0,.25)}.absent-list{display:grid;gap:8px}.absent{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border:1px solid #e8ebef;border-radius:9px}.tag{font-size:11px;padding:4px 7px;border-radius:999px;background:#fff2e8;color:#9a4b12;white-space:nowrap}.empty{padding:20px;text-align:center;color:#667085;background:#fafbfc;border-radius:10px}.error{margin-bottom:15px;background:#fff0f0;color:#a21b1b;padding:12px;border-radius:10px}.loading{color:#667085}.legend{font-size:12px;color:#667085;margin-top:12px}@media(max-width:850px){.grid-top{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.app{padding:16px}.day{min-height:75px}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useEffect,useMemo,useState} = React;

/* =========================================================
   DATA CONTRACTS: application state uses the exact properties
   requested in the specification.
   ========================================================= */

const today = new Date();
const iso = d => new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const addDays = (s,n) => { const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return iso(d); };
const daysInMonth = (year,month) => new Date(year,month,0).getDate();
const fmtDate = s => new Date(s+'T00:00:00').toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'});
const monthKey = (year,month) => `${year}-${String(month).padStart(2,'0')}`;

function dateParts(s){const [year,month,day]=s.split('-').map(Number);return {year,month,day}}

/* Mock database. Admins intentionally have teamNo:null and are excluded everywhere. */
const users = [
  {userId:'u1',name:'Alicia Tan',userType:'employee',teamNo:1},
  {userId:'u2',name:'Brandon Lim',userType:'employee',teamNo:1},
  {userId:'u3',name:'Cheryl Ng',userType:'employee',teamNo:1},
  {userId:'u4',name:'Daniel Koh',userType:'employee',teamNo:2},
  {userId:'u5',name:'Ethan Lee',userType:'employee',teamNo:2},
  {userId:'u6',name:'Farah Wong',userType:'employee',teamNo:2},
  {userId:'u7',name:'Gavin Ho',userType:'employee',teamNo:3},
  {userId:'u8',name:'Hannah Goh',userType:'employee',teamNo:3},
  {userId:'u9',name:'Isaac Chua',userType:'employee',teamNo:3},
  {userId:'a1',name:'Admin User',userType:'admin',teamNo:null}
];
const leaveBalances = [
  {userId:'u1',leaveBalance:{annualLeave:14,medicalLeave:14,hospitalLeave:60}},
  {userId:'u2',leaveBalance:{annualLeave:10,medicalLeave:14,hospitalLeave:60}},
  {userId:'u3',leaveBalance:{annualLeave:8,medicalLeave:12,hospitalLeave:60}},
  {userId:'u4',leaveBalance:{annualLeave:12,medicalLeave:14,hospitalLeave:60}},
  {userId:'u5',leaveBalance:{annualLeave:14,medicalLeave:13,hospitalLeave:60}},
  {userId:'u6',leaveBalance:{annualLeave:6,medicalLeave:14,hospitalLeave:60}},
  {userId:'u7',leaveBalance:{annualLeave:14,medicalLeave:14,hospitalLeave:60}},
  {userId:'u8',leaveBalance:{annualLeave:11,medicalLeave:14,hospitalLeave:60}},
  {userId:'u9',leaveBalance:{annualLeave:14,medicalLeave:14,hospitalLeave:60}}
];
const shifts=[];
function makeShift(date,amTeam,amAbs,pmTeam,pmAbs,restTeam){const p=dateParts(date);shifts.push({year:p.year,month:p.month,day:p.day,am:{team:amTeam,absents:amAbs},pm:{team:pmTeam,absents:pmAbs},rest:{team:restTeam}})}
const t=iso(today);
for(let i=0;i<35;i++){
  const d=addDays(t,i); const teams=[1,2,3][i%3]; const am=[1,2,3][i%3]; const pm=[1,2,3][(i+1)%3]; const rest=[1,2,3][(i+2)%3];
  const amAbs=i%4===0?['u1']:i%7===0?['u2']:[]; const pmAbs=i%5===0?['u4']:i%9===0?['u5']:[];
  makeShift(d,am,amAbs,pm,pmAbs,rest);
}
const requests=[
 {requestId:'r1',requestType:'leaves',requesterId:'u1',status:'approved',admin:'a1',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),targetData:{userId:'u1',startDate:t,endDate:t,leaveType:'annualLeave',reason:'Personal leave'}},
 {requestId:'r2',requestType:'leaves',requesterId:'u4',status:'pending',admin:null,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),targetData:{userId:'u4',startDate:addDays(t,2),endDate:addDays(t,3),leaveType:'medicalLeave',reason:'Medical appointment'}},
 {requestId:'r3',requestType:'recall',requesterId:'u2',status:'pending',admin:null,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),targetData:{userId:'u2',shiftDate:addDays(t,1)}},
 {requestId:'r4',requestType:'swap',requesterId:'u5',status:'pending',admin:null,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),targetData:{userId1:'u5',userId2:'u6',date1:addDays(t,1),date2:addDays(t,2)}}
];

function clone(x){return JSON.parse(JSON.stringify(x))}
const mockDb={
  async getUsers(){return clone(users)},
  async getLeaveBalances(){return clone(leaveBalances)},
  async getShift(date){const p=dateParts(date);return clone(shifts.find(x=>x.year===p.year&&x.month===p.month&&x.day===p.day)||null)},
  async getMonth(year,month){return clone(shifts.filter(x=>x.year===year&&x.month===month).sort((a,b)=>a.day-b.day))},
  async getRequests(){return clone(requests)},
  async approveLeave(requestId,adminId){
    const req=requests.find(r=>r.requestId===requestId); if(!req||req.requestType!=='leaves'||req.status!=='pending') throw Error('Request is not an approvable pending leave request.');
    const uid=req.targetData.userId; const user=users.find(u=>u.userId===uid); if(!user||user.userType!=='employee') throw Error('Admin accounts cannot receive leave deductions.');
    const start=new Date(req.targetData.startDate+'T00:00:00'), end=new Date(req.targetData.endDate+'T00:00:00');
    const total=Math.floor((end-start)/86400000)+1; if(total<=0) throw Error('Invalid leave date range.');
    const bal=leaveBalances.find(x=>x.userId===uid); const field=req.targetData.leaveType; if(!bal||bal.leaveBalance[field]<total) throw Error('Insufficient leave balance.');
    bal.leaveBalance[field]-=total;
    for(let i=0;i<total;i++){
      const date=addDays(req.targetData.startDate,i); const s=shifts.find(x=>{const p=dateParts(date);return x.year===p.year&&x.month===p.month&&x.day===p.day});
      if(s){ for(const period of ['am','pm']) if(s[period].team===user.teamNo && !s[period].absents.includes(uid)) s[period].absents.push(uid); }
    }
    req.status='approved'; req.admin=adminId; req.updatedAt=new Date().toISOString();
    return clone(req);
  }
};

/* Optional real Supabase adapter. DB columns expected by this example SQL are snake_case. */
function createSupabaseAdapter(url,key){
  const sb=supabase.createClient(url,key);
  const mapUser=r=>({userId:r.user_id,name:r.name,userType:r.user_type,teamNo:r.team_no});
  const mapBalance=r=>({userId:r.user_id,leaveBalance:{annualLeave:r.annual_leave,medicalLeave:r.medical_leave,hospitalLeave:r.hospital_leave}});
  const mapShift=r=>({year:r.year,month:r.month,day:r.day,am:{team:r.am_team,absents:r.am_absents||[]},pm:{team:r.pm_team,absents:r.pm_absents||[]},rest:{team:r.rest_team}});
  const mapReq=r=>({requestId:r.request_id,requestType:r.request_type,requesterId:r.requester_id,status:r.status,admin:r.admin,createdAt:r.created_at,updatedAt:r.updated_at,targetData:r.target_data||{}});
  return {
    async getUsers(){const {data,error}=await sb.from('users').select('user_id,name,user_type,team_no');if(error)throw error;return data.map(mapUser)},
    async getLeaveBalances(){const {data,error}=await sb.from('leave_balances').select('user_id,annual_leave,medical_leave,hospital_leave');if(error)throw error;return data.map(mapBalance)},
    async getShift(date){const p=dateParts(date);const {data,error}=await sb.from('daily_shifts').select('*').eq('year',p.year).eq('month',p.month).eq('day',p.day).maybeSingle();if(error)throw error;return data?mapShift(data):null},
    async getMonth(year,month){const {data,error}=await sb.from('daily_shifts').select('*').eq('year',year).eq('month',month).order('day');if(error)throw error;return data.map(mapShift)},
    async getRequests(){const {data,error}=await sb.from('requests').select('request_id,request_type,requester_id,status,admin,created_at,updated_at,target_data').order('created_at',{ascending:false});if(error)throw error;return data.map(mapReq)},
    async approveLeave(requestId,adminId){const {data,error}=await sb.rpc('approve_leave_request',{p_request_id:requestId,p_admin_id:adminId});if(error)throw error;return data}
  }
}

function teamTotal(users,team){return users.filter(u=>u.userType==='employee'&&u.teamNo===team).length}
function attendance(users,shift){if(!shift)return '—'; const total=teamTotal(users,shift.team); const absent=(shift.absents||[]).filter(id=>users.some(u=>u.userId===id&&u.userType==='employee'&&u.teamNo===shift.team)).length; return `Team ${shift.team} (${Math.max(0,total-absent)}/${total})`}
function dateForShift(s){return `${s.year}-${String(s.month).padStart(2,'0')}-${String(s.day).padStart(2,'0')}`}
function shiftFromDay(days,day){return days.find(s=>s.day===day)}
function absenteesForDate(users,requests,shift,date){
  if(!shift)return [];
  const out=[]; const approved=requests.filter(r=>r.status==='approved'&&r.requestType==='leaves'&&r.targetData.startDate<=date&&r.targetData.endDate>=date);
  for(const period of ['am','pm']){
    for(const id of (shift[period]?.absents||[])){
      const u=users.find(x=>x.userId===id&&x.userType==='employee'); if(!u)continue;
      const leave=approved.find(r=>r.targetData.userId===id);
      const type=leave?.targetData.leaveType==='annualLeave'?'Annual Leave':leave?.targetData.leaveType==='medicalLeave'?'Medical Leave':leave?.targetData.leaveType==='hospitalLeave'?'Hospital Leave':'Absent';
      out.push({user:u,period,type});
    }
  }
  return out;
}

function App(){
 const [db,setDb]=useState(mockDb); const [mode,setMode]=useState('Mock Test DB');
 const [users,setUsers]=useState([]),[balances,setBalances]=useState([]),[todayShift,setTodayShift]=useState(null),[requests,setRequests]=useState([]);
 const [monthOpen,setMonthOpen]=useState(false),[detailOpen,setDetailOpen]=useState(false),[selectedDate,setSelectedDate]=useState(null),[monthCursor,setMonthCursor]=useState({year:today.getFullYear(),month:today.getMonth()+1}),[monthData,setMonthData]=useState([]),[horizon,setHorizon]=useState([]),[loading,setLoading]=useState(true),[error,setError]=useState(''),[tip,setTip]=useState(null);
 const adminId='a1';
 async function loadBase(){setLoading(true);setError('');try{const [u,b,s,r]=await Promise.all([db.getUsers(),db.getLeaveBalances(),db.getShift(t),db.getRequests()]);setUsers(u);setBalances(b);setTodayShift(s);setRequests(r);const arr=[];for(let i=0;i<14;i++){const d=addDays(t,i);arr.push(await db.getShift(d))}setHorizon(arr);}catch(e){setError(e.message||String(e))}finally{setLoading(false)}}
 async function loadMonth(y,m){setError('');try{setMonthData(await db.getMonth(y,m))}catch(e){setError(e.message||String(e))}}
 useEffect(()=>{loadBase()},[db]);
 useEffect(()=>{if(monthOpen)loadMonth(monthCursor.year,monthCursor.month)},[monthOpen,monthCursor,db]);
 const activeEmployees=useMemo(()=>users.filter(u=>u.userType==='employee'),[users]);
 const approvedLeavesToday=useMemo(()=>{if(!todayShift)return 0;return new Set([...todayShift.am.absents,...todayShift.pm.absents].filter(id=>activeEmployees.some(u=>u.userId===id))).size},[todayShift,activeEmployees]);
 const monthName=new Date(monthCursor.year,monthCursor.month-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
 const calCells=useMemo(()=>{const first=new Date(monthCursor.year,monthCursor.month-1,1).getDay();const n=daysInMonth(monthCursor.year,monthCursor.month);return [...Array(first).fill(null),...Array.from({length:n},(_,i)=>i+1)]},[monthCursor]);
 function moveMonth(delta){let m=monthCursor.month+delta,y=monthCursor.year;if(m<1){m=12;y--}if(m>12){m=1;y++}setMonthCursor({year:y,month:m})}
 function openDay(day){const date=`${monthCursor.year}-${String(monthCursor.month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;setSelectedDate(date);setDetailOpen(true)}
 async function connectSupabase(){const url=prompt('Supabase project URL');const key=prompt('Supabase anon/public key');if(url&&key){setDb(createSupabaseAdapter(url,key));setMode('Supabase')}}
 async function approve(requestId){try{await db.approveLeave(requestId,adminId);const r=await db.getRequests();setRequests(r);const [s,b]=await Promise.all([db.getShift(t),db.getLeaveBalances()]);setTodayShift(s);setBalances(b);alert('Leave approved and attendance/balance updated.')}catch(e){alert(e.message||String(e))}}
 return <div className="app">
  <div className="topbar"><div><div className="title">Shift, Leave & Schedule Dashboard</div><div className="sub">Live operational view • {fmtDate(t)}</div></div><div className="mode">{mode}</div></div>
  {error&&<div className="error">{error}</div>}
  <div className="grid-top">
   <section className="panel"><h2>Daily Breakdown</h2>{loading?<div className="loading">Loading…</div>:<div className="cards">
    <div className="metric"><div className="label">AM Shift</div><div className="value">{attendance(users,todayShift?.am)}</div></div>
    <div className="metric"><div className="label">PM Shift</div><div className="value">{attendance(users,todayShift?.pm)}</div></div>
    <div className="metric"><div className="label">Approved Leaves / Absent Today</div><div className="value">{approvedLeavesToday}</div></div>
   </div>}</section>
   <section className="panel"><h2>Calendar Breakdown</h2><p className="sub">Inspect attendance by month and drill into individual absences.</p><button className="calendar-btn" onClick={()=>setMonthOpen(true)}>View Monthly Calendar</button><div className="legend">Admins are excluded from team totals, absences, recall and swap eligibility.</div></section>
  </div>
  <section className="panel horizon"><h2>14-Day Attendance Overview Horizon</h2><div className="table-wrap"><table className="table"><thead><tr><th>Date</th><th>AM Shift</th><th>PM Shift</th><th>REST Shift</th></tr></thead><tbody>{horizon.map((s,i)=>{const date=addDays(t,i);return <tr key={date}><td>{fmtDate(date)}</td><td><span className="pill">{attendance(users,s?.am)}</span></td><td><span className="pill">{attendance(users,s?.pm)}</span></td><td><span className="pill">{s?`Team ${s.rest.team}`:'—'}</span></td></tr>})}</tbody></table></div></section>
  <section className="panel" style={{marginTop:18}}><h2>Pending Requests (test control)</h2><div className="legend">The test database is in-memory; approving a leave updates its balance, daily absences, and request audit state together.</div>{requests.filter(r=>r.status==='pending').map(r=><div className="absent" key={r.requestId}><div><b>{r.requestType}</b> · {r.requestId}<div className="sub">Requester: {users.find(u=>u.userId===r.requesterId)?.name||r.requesterId}</div></div>{r.requestType==='leaves'&&<button className="navbtn" onClick={()=>approve(r.requestId)}>Approve leave</button>}</div>)}{!requests.some(r=>r.status==='pending')&&<div className="empty">No pending requests.</div>}</section>
  {monthOpen&&<div className="overlay" onClick={()=>setMonthOpen(false)}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-head"><h2 style={{margin:0}}>Monthly Calendar</h2><button className="close" onClick={()=>setMonthOpen(false)}>×</button></div><div className="month-nav"><button className="navbtn" onClick={()=>moveMonth(-1)}>‹</button><div className="month-title">{monthName}</div><button className="navbtn" onClick={()=>moveMonth(1)}>›</button></div><div className="cal-grid">{['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=><div className="dow" key={x}>{x}</div>)}{calCells.map((day,i)=>{if(!day)return <div key={'x'+i}/>;const s=shiftFromDay(monthData,day);return <button key={day} className="day" onMouseEnter={e=>{if(s)setTip({x:e.clientX+10,y:e.clientY+10,s})}} onMouseMove={e=>{if(s)setTip(v=>v?{...v,x:e.clientX+10,y:e.clientY+10}:v)}} onMouseLeave={()=>setTip(null)} onClick={()=>openDay(day)}><div className="day-num">{day}</div>{s&&<><div className="shift-mini">AM: T{s.am.team} {attendance(users,s.am).match(/\(([^)]+)\)/)?.[1]}</div><div className="shift-mini">PM: T{s.pm.team} {attendance(users,s.pm).match(/\(([^)]+)\)/)?.[1]}</div><div className="shift-mini">REST: T{s.rest.team}</div></>}</button>})}</div></div></div>}
  {tip&&<div className="tooltip" style={{left:tip.x,top:tip.y}}>AM: {attendance(users,tip.s.am)}<br/>PM: {attendance(users,tip.s.pm)}<br/>REST: Team {tip.s.rest.team}</div>}
  {detailOpen&&<div className="overlay" onClick={()=>setDetailOpen(false)}><div className="modal small" onClick={e=>e.stopPropagation()}><div className="modal-head"><h2 style={{margin:0}}>Absences · {selectedDate&&fmtDate(selectedDate)}</h2><button className="close" onClick={()=>setDetailOpen(false)}>×</button></div>{(()=>{const s=monthData.find(x=>dateForShift(x)===selectedDate);const rows=absenteesForDate(users,requests,s,selectedDate);return rows.length?<div className="absent-list">{rows.map((r,i)=><div className="absent" key={r.user.userId+'-'+r.period+'-'+i}><span><b>{r.user.name}</b><div className="sub">{r.period.toUpperCase()} · Team {r.user.teamNo}</div></span><span className="tag">{r.type}</span></div>)}</div>:<div className="empty">No employee absences recorded for this date.</div>})()}</div></div>}
  <div style={{marginTop:18,display:'flex',gap:10}}><button className="navbtn" onClick={connectSupabase}>Connect real Supabase</button><button className="navbtn" onClick={()=>{setDb(mockDb);setMode('Mock Test DB')}}>Use test DB</button></div>
 </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
